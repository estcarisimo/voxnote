name: Bug report
description: Something does not work as described in the README
labels: [bug]
body:
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPad Pro 11 (2024), Safari 26 / Chromium 140 on Linux
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: pdf
    attributes:
      label: PDF
      description: Attach a public-domain or synthetic PDF that reproduces it. Never attach an unpublished manuscript.
