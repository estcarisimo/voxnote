name: Security

# Advisory scan of the locked npm dependency tree on lock changes and weekly
# (so advisories published after a merge still surface), and zizmor on the
# workflow files. CI also runs `npm audit` on every push and pull request.

on:
  push:
    branches: [main]
    paths: ['package.json', 'package-lock.json', '.github/workflows/**']
  pull_request:
    paths: ['package.json', 'package-lock.json', '.github/workflows/**']
  schedule:
    - cron: '23 6 * * 1' # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm audit --audit-level=high

  workflows:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Lint the workflows
        run: uvx zizmor --min-severity low .github/workflows/
